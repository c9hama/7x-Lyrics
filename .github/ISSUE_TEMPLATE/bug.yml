name: Bug report
description: Something else is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
  - type: input
    id: versions
    attributes: { label: Phone, Android version, 7x Lyrics version }
