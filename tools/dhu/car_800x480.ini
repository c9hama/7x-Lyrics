# Desktop Head Unit profile matching the car's 800x480 head unit.
# Run: ~/Library/Android/sdk/extras/google/auto/desktop-head-unit -c tools/dhu/car_800x480.ini
[general]
touch = true
touchpad = false
controller = false
instrumentcluster = false
resolution = 800x480
dpi = 160
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
